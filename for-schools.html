<style>
:root {
  --ink: #1a1814;
  --terra: #C4633A;
  --terra-light: #F5EDE8;
  --cream: #FAF8F5;
  --white: #ffffff;
  --gray: #888;
  --border: #e8e3de;
  --green: #2E7D32;
  --green-light: #EAF3DE;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--cream); }

/* BETA BANNER */
.beta-bar { background: var(--terra-light); border-bottom: 1px solid #e8d5c8; color: #8B3A1F; font-size: 12px; text-align: center; padding: 9px 20px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.beta-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--terra); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.beta-bar a { color: var(--terra); text-decoration: none; font-weight: 600; }

/* NAV */
nav { background: var(--white); border-bottom: 1px solid var(--border); height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: sticky; top: 0; z-index: 500; }
.logo { display: flex; flex-direction: column; line-height: 1; text-decoration: none; }
.logo-top { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -.8px; }
.logo-line { width: 100%; height: 2px; background: var(--terra); margin: 4px 0 3px; position: relative; }
.logo-line::after { content:''; position: absolute; right: 0; top: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--terra); }
.logo-bottom { font-size: 10px; color: var(--gray); letter-spacing: 3.5px; text-transform: uppercase; }
.nav-links { display: flex; align-items: center; gap: 24px; font-size: 13px; }
.nav-links a { text-decoration: none; color: var(--gray); transition: color .2s; }
.nav-links a:hover { color: var(--ink); }
.nav-signin { display: flex; align-items: center; gap: 7px; background: var(--terra-light); border: 1px solid #e8c4b0; border-radius: 30px; padding: 6px 14px 6px 8px; font-size: 13px; font-weight: 500; color: #8B3A1F; cursor: pointer; text-decoration: none; transition: background .2s; }
.nav-signin:hover { background: #f0ddd4; color: #8B3A1F !important; }
.nav-signin-icon { width: 24px; height: 24px; border-radius: 50%; background: var(--terra); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav-signin-icon svg { width: 13px; height: 13px; }
.nav-signin-chevron { font-size: 9px; margin-left: 2px; transition: transform .2s; }
.nav-signin-wrap { position: relative; }
.nav-signin-wrap:hover .nav-signin-chevron { transform: rotate(180deg); }
.nav-signin-menu { display: none; position: absolute; top: calc(100% + 10px); right: 0; background: var(--white); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.1); min-width: 220px; padding: 6px; z-index: 600; }
.nav-signin-wrap:hover .nav-signin-menu { display: block; }
.nav-signin-menu a { display: flex !important; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13px; color: var(--ink) !important; text-decoration: none; font-weight: 500; transition: background .15s; }
.nav-signin-menu a:hover { background: var(--cream); }
.nav-signin-menu-ico { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.nav-signin-menu-sub { font-size: 11px; color: var(--gray); font-weight: 400; margin-top: 1px; }
.nav-signin-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

/* PAGE HERO */
.page-hero { background: var(--ink); padding: 64px 40px 56px; position: relative; overflow: hidden; }
.page-hero::before { content: ''; position: absolute; top: -80px; right: -80px; width: 500px; height: 500px; background: radial-gradient(ellipse, rgba(196,99,58,.12) 0%, transparent 65%); pointer-events: none; }
.breadcrumb { font-size: 11px; color: rgba(255,255,255,.35); margin-bottom: 20px; }
.breadcrumb a { color: var(--terra); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.hero-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--terra); margin-bottom: 14px; }
.hero-title { font-family: 'Cormorant Garamond', serif; font-size: 48px; font-weight: 600; color: #fff; line-height: 1.1; max-width: 640px; }
.hero-title em { font-style: italic; color: rgba(255,255,255,.75); }
.hero-sub { font-size: 16px; color: rgba(255,255,255,.55); line-height: 1.7; max-width: 520px; margin-top: 18px; font-weight: 300; }

/* MAIN CONTENT */
.content-wrap { max-width: 800px; margin: 0 auto; padding: 64px 40px 80px; }

/* SECTION */
.about-section { margin-bottom: 56px; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--terra); margin-bottom: 10px; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 600; color: var(--ink); line-height: 1.2; margin-bottom: 18px; }
.section-body { font-size: 15px; color: #555; line-height: 1.8; }
.section-body p { margin-bottom: 14px; }
.section-body p:last-child { margin-bottom: 0; }

/* TERMS */
.terms-updated { font-size: 13px; color: var(--gray); margin-bottom: 40px; }
.terms-section { margin-bottom: 40px; }
.terms-section h2 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.25; margin-bottom: 14px; }
.terms-section ul { margin: 0 0 14px 20px; }
.terms-section li { margin-bottom: 8px; }
.terms-section a { color: var(--terra); }
.terms-note { background: var(--terra-light); border: 1.5px solid #e8c4b0; border-radius: 14px; padding: 20px 24px; font-size: 14px; color: #8B3A1F; line-height: 1.7; margin-bottom: 40px; }
.terms-note strong { color: var(--ink); }

/* FOOTER */

.nav-dropdown { position: relative; }
.nav-dropdown > a { display: flex; align-items: center; gap: 4px; color: var(--gray); text-decoration: none; transition: color .2s; }
.nav-dropdown > a:hover { color: var(--ink); }
.nav-dropdown-menu { display: none; position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(-50%); background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.1); min-width: 200px; padding: 6px; z-index: 600; }
.nav-dropdown:hover .nav-dropdown-menu { display: block; }
.nav-dropdown-menu a { display: block; padding: 9px 14px; border-radius: 8px; font-size: 13px; color: var(--ink) !important; text-decoration: none; transition: background .15s; white-space: nowrap; }
.nav-dropdown-menu a:hover { background: var(--cream); }
.menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
/* MOBILE */
@media (max-width: 768px) {

  .approach-block { padding: 22px 20px; }
  .mission-block { padding: 26px 22px; }
}
